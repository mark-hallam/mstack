name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "18"
            python: "3.9"
          - os: ubuntu-latest
            node: "22"
            python: "3.12"
          - os: macos-latest
            node: "20"
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Leak and style scan
        run: python3 tests/leak_scan.py
      - name: Self-test (three review rounds on a local page)
        env:
          MSTACK_CHROME_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
        run: python3 tests/selftest.py
