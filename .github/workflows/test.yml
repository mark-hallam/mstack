name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: "18"
            python: "3.9"
          - os: ubuntu-latest
            node: "22"
            python: "3.12"
          - os: macos-latest
            node: "20"
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Safety scan (leaks)
        run: python3 tests/leak_scan.py
      - name: Style check
        run: python3 tests/style_scan.py
      - name: Every test (packaging, mstack, outcome-first, away-mode, multi-evaluator)
        env:
          MSTACK_CHROME_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
        run: python3 tests/run_all.py
