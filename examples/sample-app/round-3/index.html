<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Reading list</title>
<style>
:root{--page:#f2f2f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--rule:#e5e5ea;--accent:#0a64d6}
@media (prefers-color-scheme:dark){:root{--page:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#aeaeb2;--rule:#38383a;--accent:#64a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px}
h1{font-size:32px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--sub);margin:0 0 20px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--rule)}li:first-child{border-top:0}
li span{flex:1}li small{color:var(--sub)}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--page);color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:#fff;margin-top:16px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head>
<body><main>
<h1>Reading list</h1>
<p class="sub">Two to read, one finished.</p>
<ul>
<li><span>A short history of maps<br><small>Added Monday</small></span><button aria-label="Mark A short history of maps as read">Mark as read</button></li>
<li><span>Gardening for small balconies<br><small>Added Tuesday</small></span><button aria-label="Mark Gardening for small balconies as read">Mark as read</button></li>
<li><span>Learning to sail<br><small>Finished</small></span><button aria-label="Move Learning to sail back to unread">Read</button></li>
</ul>
<button class="primary" id="add">Add a book</button>
</main></body></html>
